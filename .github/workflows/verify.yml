name: Verify plugin

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Verify sealed plugin
        run: python -B verify.py
      - name: Exercise demo run
        shell: bash
        run: |
          set -euo pipefail
          demo_root="/tmp/evidence-research-demo"
          rm -rf "$demo_root"
          python -B scripts/researchctl.py demo "$demo_root"
          run_dir="$(find "$demo_root" -mindepth 1 -maxdepth 1 -type d -name 'run_*' -print -quit)"
          test -n "$run_dir"
          test -f "$run_dir/run.json"
          python -B scripts/researchctl.py audit "$run_dir"
