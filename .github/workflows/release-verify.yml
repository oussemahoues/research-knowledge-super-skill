name: Release verification

on:
  pull_request:
  workflow_dispatch:
  push:
    tags:
      - "v3.*"

permissions:
  contents: read

jobs:
  release-verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Development verification
        run: python -B verify.py
      - name: Fixed benchmark and promotion gate
        run: python -B scripts/run_benchmark.py --output benchmark-report.json
      - name: Build deterministic release manifest
        run: python -B scripts/build_manifest.py
      - name: Verify complete release seal
        run: python -B verify.py --release
      - name: Archive release evidence
        uses: actions/upload-artifact@v4
        with:
          name: evidence-research-v3-release-${{ matrix.python-version }}
          path: |
            MANIFEST.json
            benchmark-report.json
          if-no-files-found: error
